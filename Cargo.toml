[workspace]
resolver = "2"
members = [
    "crates/ksi-models",
    "crates/ksi-db",
    "crates/ksi-auth",
    "crates/ksi-api",
    "crates/ksi-backend",
]

[workspace.package]
edition = "2021"
rust-version = "1.85.0"
license = "MIT"
repository = "https://github.com/fi-ksi/web-backend"

# Centralized dependency versions (like Modrinth's [workspace.dependencies]).
[workspace.dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.5", features = ["cors"] }
tower = "0.4"
tracing = "0.1"
bcrypt = "0.15"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
anyhow = "1"

ksi-models = { path = "crates/ksi-models" }
ksi-db = { path = "crates/ksi-db" }
ksi-auth = { path = "crates/ksi-auth" }
ksi-api = { path = "crates/ksi-api" }
