services:
  ksi-be:
    build:
      context: .
      dockerfile: Dockerfile
    image: fi0ksi/ksi-be-rust
    ports:
      - "3030:3030"
    volumes:
      - ksi-backend-db:/var/ksi-be
    environment:
      - LISTEN_ADDR=0.0.0.0:3030
      - DATABASE_URL=sqlite:///var/ksi-be/db.sqlite
      - CORS_ORIGIN=${CORS_ORIGIN:-}
    container_name: ksi-be

volumes:
  ksi-backend-db:
