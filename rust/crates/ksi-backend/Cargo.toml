[package]
name = "ksi-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ksi-backend"
path = "src/main.rs"

[lib]
name = "ksi_backend"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "mysql", "chrono", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.5", features = ["cors"] }
tower = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bcrypt = "0.15"
uuid = { version = "1", features = ["v4"] }
mime = "0.3"
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
axum-test = "16"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
jsonschema = "0.26"
zip = { version = "2", default-features = false, features = ["deflate"] }
